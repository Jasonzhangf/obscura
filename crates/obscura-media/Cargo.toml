[package]
name = "obscura-media"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
webrtc-probe = ["dep:async-trait", "dep:rtc", "dep:webrtc-rs"]
webrtc = ["webrtc-probe", "dep:futures-util", "dep:tokio-rustls", "dep:tokio-tungstenite"]

[dependencies]
obscura-host-protocol = { path = "../../protocol/browser" }
tokio = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
async-trait = { version = "0.1", optional = true }
rtc = { version = "=0.21.0-rc.2", default-features = false, features = ["crypto-ring"], optional = true }
webrtc-rs = { package = "webrtc", version = "=0.21.0-rc.2", default-features = false, features = ["runtime-tokio", "crypto-ring"], optional = true }
futures-util = { version = "0.3", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
tokio-tungstenite = { workspace = true, optional = true }

[[bin]]
name = "obscura-webrtc-receiver"
path = "src/bin/webrtc_receiver.rs"
required-features = ["webrtc"]
